name: Update standings
on:
  schedule:
    - cron: "5 16,17 * * 2"     # Tuesdays just after Vulture's noon-ET update (covers EDT and EST)
  workflow_dispatch:
  push:
    paths: [manual.json]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "standings-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update standings" && git push)
